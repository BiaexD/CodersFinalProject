<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły sprzętu</title>
</head>
<body>

<h1>{{ equipment.name }}</h1>

<p><strong>Kategoria:</strong> {{ equipment.category.name }}</p>
<p><strong>Opis:</strong> {{ equipment.description }}</p>
<p><strong>Dostępna ilość:</strong> {{ equipment.quantity }}</p>
<p><strong>Cena za dzień:</strong> {{ equipment.price_per_day }} zł</p>
<p><strong>Kaucja:</strong> {{ equipment.deposit }} zł</p>

<p><a href="{% url 'equipment_list' %}">← Powrót do listy sprzętu</a></p>

</body>
</html>
