<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zamowienie zrealizowane</title>
</head>
<body>
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li class="{{ message.tags }}" style="color: red; font-weight: bold">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <a href="{% url 'home' %}">← Powrót do strony głównej</a>
</body>
</html>
