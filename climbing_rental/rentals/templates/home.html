<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    {% if user.is_authenticated %}
        <p>Witaj, {{ user.username }}!</p>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none;border:none;padding:0;color:#00f;text-decoration:underline;cursor:pointer;">
                <h2>Wyloguj</h2>
            </button>
        </form>
    <br>
        <a href="{% url 'user_rentals' %}">Hstoria wypozyczen</a>
    {% else %}
        <a href="{% url 'login' %}">Zaloguj</a>
        <p>Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a></p>
    {% endif %}
    <br>
    <br>
    <a href="{% url 'cart' %}">🛒 Koszyk ({{ cart_count }})</a>
        <ul>
          {% for category in categories %}
            <li>
              <a href="{% url 'category_detail' category.id %}">{{ category.name }}</a>
            </li>
          {% endfor %}
        </ul>
</body>
</html>
